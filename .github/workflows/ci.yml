name: first CI-file

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Скачивание кода из репозитория
      uses: actions/checkout@v4

    - name: Установка NodeJs
      uses: actions/setup-node@v4

    - name: Установка зависимостей
      run: npm install

    - name: Запуск тестов
      run: npm test

build:
  needs: test
  runs-on: ubuntu-latest
  steps:
    - name: Скачивание репозитория
      uses: actions/checkout@v4

    - name: Сохранение артефакта
      run: zip -r weather-report-app.zip . -x "*.git*" "node_modules/*"

    - name: Сохранение артефакта в гит
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: weather-report-app.zip
        retention-days: 7
